name: Deploy Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar el servicio existente
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "No hay secreto RENDER_DEPLOY_HOOK. El deploy queda en Auto-Deploy del panel de Render (servicio reservaespacios, rama main)."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
          echo "Deploy de Render solicitado."
